map $arg_event $event_name {
  default "";
  page_view page_view;
  search_used search_used;
  ranking_view_changed ranking_view_changed;
  category_selected category_selected;
  plugin_github_click plugin_github_click;
  plugin_link_copy plugin_link_copy;
  install_guide_open install_guide_open;
  install_command_copy install_command_copy;
}

map $event_name $event_is_valid {
  default 1;
  "" 0;
}

map $request_method $event_method_is_valid {
  default 0;
  POST 1;
}

map "$event_is_valid:$event_method_is_valid:$arg_session" $event_should_log {
  default 0;
  "~^1:1:s_[A-Za-z0-9_-]{12,64}$" 1;
}

map $arg_session $event_session {
  default "";
  "~^s_[A-Za-z0-9_-]{12,64}$" $arg_session;
}

map $arg_view $event_view {
  default "";
  "~^(home|top100|hot|rising|all|total|category|search|dsh)$" $arg_view;
}

map $arg_category $event_category {
  default "";
  "~^(ai|appearance|coding|knowledge|tools|security)$" $arg_category;
}

map $arg_plugin $event_plugin {
  default "";
  "~^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})/[A-Za-z0-9._-]{1,100}$" $arg_plugin;
}

map $arg_rank $event_rank {
  default "";
  "~^[0-9]{1,7}$" $arg_rank;
}

map $arg_path $event_path {
  default "";
  "~^/[A-Za-z0-9._/-]{0,256}$" $arg_path;
}

map $uri $response_cache_control {
  default "no-cache";
  /api/events "no-store";
  /robots.txt "public, max-age=3600";
  /sitemap.xml "public, max-age=3600";
  /favicon.svg "public, max-age=86400";
  /favicon.ico "public, max-age=86400";
  /assets/dsh-top100-og.png "public, max-age=86400";
  /data/manifest.json "public, max-age=300, must-revalidate";
  "~^/data/snapshots/" "public, max-age=31536000, immutable";
  "~^/data/" "public, max-age=300, must-revalidate";
}

map $uri $response_x_robots_tag {
  default "";
  "~^/data/" "noindex, nofollow";
}

log_format event_json escape=json
  '{"time":"$time_iso8601","event":"$event_name","session":"$event_session",'
  '"view":"$event_view","category":"$event_category","plugin":"$event_plugin",'
  '"rank":"$event_rank","path":"$event_path"}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Cache-Control "$response_cache_control" always;
  add_header X-Robots-Tag "$response_x_robots_tag" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /api/events {
    if ($event_method_is_valid = 0) {
      return 405;
    }

    access_log /dev/stdout event_json if=$event_should_log;
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_body_timeout 5s;
    return 204;
  }

  location = /robots.txt {
    try_files $uri =404;
    default_type text/plain;
  }

  location = /sitemap.xml {
    try_files $uri =404;
    default_type application/xml;
  }

  location = /favicon.svg {
    try_files $uri =404;
    default_type image/svg+xml;
  }

  location = /favicon.ico {
    try_files $uri =404;
    default_type image/x-icon;
  }

  location = /assets/dsh-top100-og.png {
    try_files $uri =404;
    default_type image/png;
  }

  location = /data/manifest.json {
    try_files $uri =404;
    default_type application/json;
  }

  location ^~ /data/snapshots/ {
    try_files $uri =404;
    default_type application/json;
  }

  location /data/ {
    try_files $uri =404;
    default_type application/json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# HTTPS is terminated by an outer Caddy instance in production. Its site block
# must also enable `encode zstd gzip`; inner Nginx gzip cannot compress a file
# that Caddy serves or replaces before proxying. Caddy access logging must also
# exclude `/api/events` (or redact its query, client IP, User-Agent and Referer),
# otherwise the outer proxy would undo the privacy guarantees of `event_json`.
