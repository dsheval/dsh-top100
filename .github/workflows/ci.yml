name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit all dependencies
        run: npm run audit:security

      - name: Typecheck and test
        run: npm run check

      - name: Validate runtime publication
        run: |
          cp .env.example .env
          npm run runtime:prepare
          npm run db:sync

      - name: Validate Docker configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          load: true
          push: false
          tags: dsh-top100-web:ci
          cache-from: type=gha,scope=dsh-top100-web
          cache-to: type=gha,scope=dsh-top100-web,mode=max

      - name: Build scheduler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/collector.Dockerfile
          load: true
          push: false
          tags: dsh-top100-scheduler:ci
          cache-from: type=gha,scope=dsh-top100-scheduler
          cache-to: type=gha,scope=dsh-top100-scheduler,mode=max
